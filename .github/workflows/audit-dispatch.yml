# Chained backfill dispatcher for the audit queue (part of the fully automated observation experiment)
# Background: GitHub concurrency groups replace an old pending run with a new one, so they cannot
# serve as a queue — of 20 batch-triggered runs only 2 survived.
# Hence chaining: each time an agent-audit run completes (success/failure), this dispatcher backfills the next pending item.
# Dispatch order: ① the batch-top20.json manifest order ② remaining pending items (enqueued by watch-updates version tracking) in ascending enqueue time.
# attempts are recorded in the queue file (legacy fallback: manifest.attempts); still pending after ≥2 attempts → flagged for extended review; watch re-enqueue resets the counter.
# To stop a batch durably: disable this workflow, or empty the ids in batch-top20.json. Cancelling a
# running agent-audit run no longer drops its entry — orphan recovery requeues it after ~30 min.
name: audit-dispatch

# Title shown in the Actions list (agent-audit already carries "[Audit] <plugin> · issue #N").
# The dispatcher picks its queue entry only inside the run, so the title carries the trigger
# context instead: fast path shows the completed audit run that woke it; a chain-next wake-up from
# agent-audit's tail job is labeled "chained"; cron/manual are labeled.
run-name: "[Dispatch] ${{ github.event_name == 'workflow_run' && format('after {0}', github.event.workflow_run.name) || (github.event_name == 'schedule' && 'cron backstop' || (inputs.exclude_run_id != '' && 'chained' || 'manual backfill')) }}"

# Trigger paths:
#  - workflow_run: backfill immediately after a manually triggered (user token) agent-audit run completes (fast path)
#  - schedule: fallback self-heal every 10 min (required! completion events of runs dispatched with GITHUB_TOKEN are suppressed by GitHub, breaking the chain)
#  - workflow_dispatch: manual backfill / chain restart / agent-audit's chain-next job (explicit REST
#    dispatch is NOT subject to the event-cascade suppression; exclude_run_id lets us subtract the
#    still-in_progress caller run from the busy pre-filter — design: docs/design/audit-chain-dispatch.md)
on:
  workflow_run:
    workflows: ["agent-audit"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      exclude_run_id:
        description: "run id to ignore in the active-run pre-filter (agent-audit's chain job calls while its own run is still in_progress)"
        required: false
        default: ""
        type: string

permissions:
  contents: write # write back the attempts counter
  actions: write # dispatch the next agent-audit

concurrency:
  group: audit-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    # For workflow_run events, backfill only on success/failure (cancelled = the way a human stops a batch); cron/manual triggers always check
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Backfill next pending item and dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXCLUDE_RUN_ID: ${{ inputs.exclude_run_id }}
        run: |
          set -e
          # Queue-file lock protocol — the runs API is NOT a dispatch lock: a freshly dispatched run
          # can stay invisible to `gh run list` for tens of seconds, so two serialized dispatcher
          # runs both read "idle" and double-dispatched dsh-agent-teams (5-issue E2E, 2026-08-22).
          # The queue file on main is the only state dispatcher runs truly serialize on (this
          # workflow's own concurrency group + git push): dispatch now marks the entry `auditing`
          # and pushes BEFORE `gh workflow run`; any entry already auditing = an audit in flight →
          # stand down. The API busy-check below stays as a cheap pre-filter (covers entries
          # dispatched before this protocol existed, whose queue status is still pending).
          #
          # exclude_run_id (chain mode): agent-audit's chain-next job fires this dispatcher while its
          # own run is still in_progress, so the caller id is subtracted from every visibility check
          # (string comparison — an empty input excludes nothing; see audit-chain-dispatch.md §F3).
          visible_runs() {
            gh run list --workflow=agent-audit.yml --status "$1" --json databaseId \
              --jq --arg ex "$EXCLUDE_RUN_ID" '[.[] | select(.databaseId | tostring != $ex)] | length'
          }
          ACTIVE=$(visible_runs in_progress)
          QUEUED=$(visible_runs queued)
          if [ "$ACTIVE" != "0" ] || [ "$QUEUED" != "0" ]; then
            echo "agent-audit still has active runs ($ACTIVE running / $QUEUED queued); not dispatching"
            exit 0
          fi

          # Orphan recovery: an entry stuck auditing ≥30 min (its run died or was cancelled before
          # postcheck's terminal write) is requeued — gated on zero visible runs; 30 min far exceeds
          # any runs-API staleness, so a live run cannot be misjudged as orphaned. To halt a batch
          # durably, disable this workflow (or empty batch-top20.json ids) — cancelling a run only
          # pauses its entry until orphan recovery requeues it (~30 min).
          # Chain mode (exclude_run_id set): crash paths (gate fatal, unclassified hard failure) never
          # write a terminal queue state, so the entry is still `auditing` when the caller's chain job
          # fires. Single-flight invariant (agent-audit concurrency group, cancel-in-progress:false):
          # the only in-progress run is the caller's, so any `auditing` entry can only be its own —
          # the 30-min staleness window does not apply and the entry is requeued immediately (§F2).
          git config user.name "SoberReport-AI"
          git config user.email "59252154+SoberReport-AI@users.noreply.github.com"

          # stdout hygiene: this function's stdout is captured into RESULT — `git reset --hard`
          # prints "HEAD is now at ..." to stdout, which once polluted RESULT, broke MODE parsing
          # and aborted the commit with an empty message (2026-08-22). All git plumbing → stderr.
          evaluate() {
            git fetch origin >&2
            git reset --hard -q origin/main >&2
            node -e "
              const fs = require('fs');
              const now = new Date();
              const chain = process.env.EXCLUDE_RUN_ID !== '';
              const cut = chain ? now.getTime() + 1 : now.getTime() - 30 * 60 * 1000;
              const dir = '_import/audit-queue';
              const readQ = (id) => { try { return JSON.parse(fs.readFileSync(dir + '/' + id + '.json', 'utf8')); } catch { return null; } };
              const lastAt = (q) => (q.history || []).map((h) => h.at).sort().pop() || '';
              const ids = fs.readdirSync(dir).filter((f) => f.endsWith('.json')).map((f) => f.slice(0, -5));

              // ① orphan recovery candidates (auditing whose last state change is ≥30 min old)
              const orphans = ids.filter((id) => {
                const q = readQ(id);
                if (!q || q.status !== 'auditing') return false;
                const t = Date.parse(lastAt(q));
                return Number.isNaN(t) || t < cut;
              });
              if (orphans.length) {
                for (const id of orphans) {
                  const q = readQ(id);
                  q.status = 'pending';
                  q.history = q.history || [];
                  q.history.push({ at: now.toISOString(), action: 'requeued', reason: 'orphaned dispatch: no terminal write within 30 min of dispatch (run died or was cancelled)' });
                  fs.writeFileSync(dir + '/' + id + '.json', JSON.stringify(q, null, 2) + '\n');
                }
                console.log('ORPHAN|' + orphans.join(','));
                process.exit(0);
              }

              // ② file lock: any entry auditing = an audit in flight
              const inflight = ids.filter((id) => { const q = readQ(id); return q && q.status === 'auditing'; });
              if (inflight.length) { console.log('BUSY|' + inflight.join(',')); process.exit(0); }

              // ③ pick next pending (manifest order first, then ascending last-enqueued time) and mark auditing
              // Treat a missing/corrupt manifest as an empty list — batch-top20.json may be removed after the batch experiment ends, and the watch flow must keep going
              let m = { ids: [], attempts: {} };
              try { m = JSON.parse(fs.readFileSync('_import/batch-top20.json', 'utf8')); } catch { /* empty-manifest fallback */ }
              m.ids = Array.isArray(m.ids) ? m.ids : [];
              m.attempts = m.attempts || {};
              const pick = (id, q) => {
                const n = q.attempts ?? m.attempts[id] ?? 0; // fall back to the manifest count when an old queue file has no attempts field
                if (n >= 2) { console.error('skipping ' + id + ': still pending after 2 attempts, flagged for extended review'); return false; }
                q.attempts = n + 1;
                q.status = 'auditing';
                q.history = q.history || [];
                q.history.push({ at: now.toISOString(), action: 'dispatched', reason: 'audit-dispatch → agent-audit' });
                fs.writeFileSync(dir + '/' + id + '.json', JSON.stringify(q, null, 2) + '\n');
                return true;
              };
              for (const id of m.ids) {
                const q = readQ(id);
                if (q && q.status === 'pending' && pick(id, q)) { console.log('DISPATCH|' + id); process.exit(0); }
              }
              const extra = [];
              for (const id of ids) {
                if (m.ids.includes(id)) continue;
                const q = readQ(id);
                if (q && q.status === 'pending') extra.push({ id, q, at: lastAt(q) });
              }
              extra.sort((a, b) => a.at.localeCompare(b.at));
              for (const { id, q } of extra) if (pick(id, q)) { console.log('DISPATCH|' + id); process.exit(0); }
              console.log('NONE|');
            "
          }

          # SEC-003: the state mutation (attempts increment / auditing mark / requeue) MUST land on
          # main before dispatching — otherwise a persistently failing push still dispatches and the
          # "≥2 attempts → extended review" escalation is silently diluted. Each retry re-fetches and
          # re-evaluates from the fresh base, so a concurrently moved queue is never overwritten.
          ROUND=0
          while :; do
            ROUND=$((ROUND+1))
            RESULT=""
            PUSHED=0
            for i in 1 2 3; do
              RESULT=$(evaluate)
              MODE=${RESULT%%|*}; NEXT=${RESULT#*|}
              case "$MODE" in
                NONE)  echo "no dispatchable items left in queue (all completed or flagged for extended review)"; exit 0 ;;
                BUSY)  echo "audit in flight (queue lock: $NEXT); not dispatching"; exit 0 ;;
                ORPHAN)
                  ACTIVE=$(visible_runs in_progress)
                  QUEUED=$(visible_runs queued)
                  if [ "$ACTIVE" != "0" ] || [ "$QUEUED" != "0" ]; then
                    echo "orphan candidates ($NEXT) but a run is visible ($ACTIVE running / $QUEUED queued); leaving them for the next round"
                    exit 0
                  fi
                  MSG="chore(dispatch): requeue orphaned entries ($NEXT) [skip ci]"
                  ;;
                DISPATCH) MSG="chore(dispatch): dispatch $NEXT [skip ci]" ;;
                # fail loud on any stdout pollution instead of committing with an empty MSG
                *) echo "::error::unparseable evaluate output — expected MODE|payload, got:"; echo "$RESULT"; exit 1 ;;
              esac
              git add _import/audit-queue
              if git diff --cached --quiet; then echo "state already persisted concurrently"; PUSHED=1; break; fi
              git commit -m "$MSG" && git push && { PUSHED=1; break; }
              sleep 5
            done
            [ "$PUSHED" = "1" ] || { echo "::error::queue state was NOT persisted to main after 3 attempts; refusing to dispatch (SEC-003)"; exit 1; }
            if [ "$MODE" = "DISPATCH" ]; then break; fi
            # ORPHAN persisted. Chain mode: the only guaranteed "next round" is the jittery cron, and
            # the single-flight invariant makes the requeued entry immediately dispatchable — loop
            # once to pick it in this same run (§F2). Non-chain triggers keep the historic
            # requeue-now-dispatch-next-round behavior; the ROUND cap bounds the loop either way.
            if [ -n "$EXCLUDE_RUN_ID" ] && [ "$ROUND" -lt 2 ]; then
              echo "orphan recovery persisted ($NEXT); chain mode — continuing to pick in this run"
              continue
            fi
            echo "orphan recovery persisted ($NEXT); dispatch happens next round"; exit 0
          done
          echo "backfill dispatch: $NEXT (trigger=${{ github.event_name }})"
          # Carry the issue linkage into the audit run: issue-sourced queue entries have an `issue`
          # field; without it agent-audit's issue-feedback job is skipped (inputs.issue_number == '')
          # and the stage-conclusions comment never lands on the submission issue.
          ISSUE=$(node -p "try{const q=JSON.parse(require('fs').readFileSync('_import/audit-queue/$NEXT.json','utf8'));q.issue?String(q.issue):''}catch(e){''}")
          gh workflow run agent-audit.yml -f queue_id="$NEXT" -f issue_number="$ISSUE"
