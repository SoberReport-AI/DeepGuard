name: validate-report

# Enforce schema hard-gate validation whenever a PR/push touches reports/**; FAIL rejects
on:
  pull_request:
    paths:
      - 'reports/**'
  push:
    paths:
      - 'reports/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Hard-gate validate all reports
        run: node scripts/validate-report.js --all
